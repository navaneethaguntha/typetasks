<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow — Type-Safe Task Manager</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>TaskFlow</h1>
      <p class="subtitle">Type-safe workflow tracker powered by TypeScript</p>
      <p id="stats" class="stats">0 todo · 0 in-progress · 0 done</p>
    </header>

    <section class="input-bar">
      <input
        id="title"
        type="text"
        placeholder="What needs to be done?"
        aria-label="Task title"
      />
      <select id="status" aria-label="Initial status">
        <option value="todo">To Do</option>
        <option value="in-progress">In Progress</option>
        <option value="done">Done</option>
      </select>
      <button id="add" type="button">Add Task</button>
    </section>

    <nav id="chips" class="filters" aria-label="Filter tasks"></nav>

    <ul id="list" class="task-list"></ul>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
